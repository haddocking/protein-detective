site_name: Protein Detective
site_url: https://bonvinlab.org/protein_detective
site_description: Deduce the protein from an EM density map.
repo_name: haddocking/protein-detective
repo_url: https://github.com/haddocking/protein-detective
edit_uri: edit/main/docs/
watch: [properdocs.yml, README.md, src/protein_detective]
use_directory_urls: false
theme:
  name: materialx
  code:
    fold:
      enabled: true
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - navigation.sections
    - content.code.copy
    - content.action.view
    - content.action.agents
    - search.highlight
    - search.share
    - toc.follow
  topbar_style: primary
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - autorefs
  - mkdocs-autoapi:
      autoapi_dir: src
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://duckdb.org/docs/current/clients/python/reference/objects.inv
            - https://pandas.pydata.org/docs/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://atomium.bio/objects.inv
          options:
            docstring_style: google
            show_source: false
  - mkdocs-jupyter:
      remove_tag_config:
        remove_input_tags:
          - hide_code
  - cyclopts

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      toc_depth: 4
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - CLI Reference: cli.md
  - Notebooks:
      - Prepare EM map: em_prepare.ipynb
      - Determine the fraction of Secondary Structure Elements (SSE): SSE_elements.ipynb
      - Visualization: visualization.ipynb
      - Meta-analysis: meta.ipynb
  - Contributing guidelines: CONTRIBUTING.md