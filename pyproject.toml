[project]
name = "protein_detective"
dynamic = ["version"]
description = "Deduce the protein from a EM density"
readme = "README.md"
requires-python = ">=3.13"
keywords = [
    "alphafold",
    "mmcif",
    "pdb",
    "protein structure",
    "protein",
    "uniprot",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Typing :: Typed",
]
dependencies = [
    "cyclopts>=4.16.1",
    "dask>=2025.5.1",
    "distributed>=2025.5.1",
    "duckdb>=1.2.2",
    "molviewspec>=1.6.0",
    "numpy>=2.3.1",
    "pandas>=2.3.0",
    "powerfit-em[opencl]>=6.1.0",
    "protein-quest>=1.7.0",
    "pyopencl>=2025.2.5",
    "rich>=14.0.0",
    "rocrate-action-recorder>=0.8.1",
    "tqdm>=4.67.1",
    "rocrate>=0.15.0",
    "haddock3>=2026.10.0",
    "gemmi>=0.7.5",
    "aiohttp>=3.12",
]

[project.urls]
Homepage = "https://github.com/haddocking/protein-detective"
Issues = "https://github.com/haddocking/protein-detective/issues"
Documentation = "https://www.bonvinlab.org/protein-detective/"
Source = "https://github.com/haddocking/protein-detective"

[project.scripts]
protein-detective = "protein_detective.cli:app"

[project.optional-dependencies]
cuda13 = ["powerfit-em[cuda13x]>=6.1.0"]
cuda12 = ["powerfit-em[cuda12x]>=6.1.0"]

[dependency-groups]
type = [
    "pyrefly>=1.1.1",
    "types-tqdm>=4.67.0.20250513",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.1.0",
    "pytest-recording>=0.13.4",
    "rocrate==0.15.0",
    "gemmi>=0.7.5",
    "pooch>=1.9.0",
]
dev = [{ include-group = "test" }, { include-group = "type" }]
docs = [
    "cyclopts[mkdocs]>=4.5.4",
    "gemmi>=0.7.3",
    "ipykernel>=6.31.0",
    "ipywidgets>=8.1.7",
    "jupysql>=0.11.1",
    "mkdocs-autoapi>=0.4.1",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-materialx>=10.2.0",
    "mkdocstrings-python>=2.0.2",
    "nbconvert>=7.16.6",
    "properdocs>=1.6.7",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/protein_detective"]

[tool.hatch.version]
path = "src/protein_detective/__version__.py"

[tool.ruff]
line-length = 120
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "A",
    # TODO enable ANN and make code more typed
    # "ANN",
    "ARG",
    "B",
    "BLE",
    "C",
    # TODO enable D and make code more descriptive
    # "D",
    "D417",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "F",
    # TODO enable FBT and factor out booleans args to separate functions
    # "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    # TODO enable NPT and use modern random
    # "NPY",
    "PD",
    "PERF",
    "PGH",
    "PLC",
    "PLE",
    # TODO enable PLR and make code less complex
    # "PLR",
    # TODO enable PT for tests/**
    # "PT",
    "PTH",
    "PLW",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SLOT",
    "SIM",
    "T",
    "TCH",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    # Conflicts with formatting
    "ISC001",
    # Conflicts with default rules
    "PLC0414",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "ARG",
    "ANN",
    "D",
    "E501",
    "DTZ001",
    "N802",
    "S101",
    "S108",
    "PLR2004",
]
"docs/**/*.ipynb" = [
    # Allow wide lines in notebooks
    "E501",
    # Allow prints
    "T201",
    # Allow pprints
    "T203",
    # Allow bare async
    "PLE1142",
    # Allow generic variable name
    "PD901",
    # Allow suspicious-url-open-usage
    "S310",
    # Allow asserts to check tutorial results
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["protein_detective"]

[tool.jupysql.SqlMagic]
displaylimit = 100

[tool.pyrefly]
preset = "strict"
project-includes = [
    "**/*.py*",
    # "**/*.ipynb",
]
# Needed for tests/helpers.py
enable-fallback-search-path = true

[tool.pytest]
minversion = "9.0"
addopts = ["--import-mode=importlib", "-m", "not manual"]
markers = [
    "manual: tests that only run when explicitly selected with '-m manual'",
]

[tool.coverage.run]
source = ["src/protein_detective"]
branch = true

[tool.zorilla]
include = ["tests/**/*.py"]
exclude = ["**/fixtures/**", "**/cassettes/**"]

[tool.zorilla.rules]
ZR004 = { enabled = false }  # disabled as sometimes you need many asserts
ZR005 = { enabled = false }  # disabled as sometimes you need absolute paths

# TODO remove once powerfit 6.1.0 is released
[tool.uv.sources]
powerfit-em = { git = "https://github.com/haddocking/powerfit", rev = "e4e9d00f642462d1425deba2362d0e877ab9146e" }
