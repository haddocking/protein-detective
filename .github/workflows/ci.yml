name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev ocl-icd-libopencl1
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Cache downloaded test data
        uses: actions/cache@v6
        with:
          path: ~/.cache/protein-detective-test-fixtures
          key: cached-protein-detective-test-fixtures
      - name: Install the project
        run: uv sync --dev
      - name: Install pocl
        run: uv pip install pocl-binary-distribution==3.0
      - name: Run tests
        run: uv run pytest --cov
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dashboard toolchain and locked dependencies
        working-directory: dashboard
        run: npm ci
      - name: Build dashboard
        working-directory: dashboard
        run: npx vp build
      - name: Check dashboard
        working-directory: dashboard
        run: npx vp check
      - name: Test dashboard
        working-directory: dashboard
        run: npx vp test run
      - name: Build the project
        run: uv build
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Run linters
        run: uvx ruff check
  typing:
    name: typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ocl-icd-opencl-dev ocl-icd-libopencl1
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install the project
        run: uv sync --dev
      - name: Run type checkers
        run: uv run pyrefly check
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install nodejs
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
